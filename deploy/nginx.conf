# HTTP: serve ACME challenges, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name rocketlauncher.space www.rocketlauncher.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://rocketlauncher.space$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rocketlauncher.space;

    root /opt/spacerocketlauncher;

    access_log /var/log/nginx/rocketlauncher.access.log;
    error_log  /var/log/nginx/rocketlauncher.error.log;

    ssl_certificate     /etc/letsencrypt/live/rocketlauncher.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rocketlauncher.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ACME HTTP-01 challenge webroot (migration + renewals)
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    # Landing page
    location = / {
        try_files /index.html =404;
    }

    # Static HTML simulator
    location = /simulator {
        try_files /simulator.html =404;
    }

    # SEO / ownership verification
    location = /robots.txt   { try_files /robots.txt =404; }
    location = /sitemap.xml  { try_files /sitemap.xml =404; }
    location = /yandex_a4530d04ae51bb11.html { try_files /yandex_a4530d04ae51bb11.html =404; }
    location = /google99c234b93909267b.html  { try_files /google99c234b93909267b.html =404; }

    # Versioned i18n assets and vendored libraries are safe to cache hard:
    # every reference carries a ?v= query that changes on release.
    location ^~ /lib/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|pdf|pptx)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Streamlit: initial physics validation
    location /streamlit/ {
        proxy_pass http://127.0.0.1:8501/streamlit/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Streamlit: Lagrange point convergence
    location /lagrange/ {
        proxy_pass http://127.0.0.1:8502/lagrange/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# www over HTTPS: redirect to the canonical apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rocketlauncher.space;

    ssl_certificate     /etc/letsencrypt/live/rocketlauncher.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rocketlauncher.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://rocketlauncher.space$request_uri;
}
